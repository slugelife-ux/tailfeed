[package]
name = "tailfeed-provenance-gate"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tlsn = { path = "../../vendor/tlsn/crates/tlsn" }
tlsn-formats = { path = "../../vendor/tlsn/crates/formats" }

anyhow = "1.0"
bincode = "1.3"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
http-body-util = "0.1"
hex = "0.4"
hyper = { version = "1.1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["full"] }
k256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny-keccak = { version = "2.0", features = ["keccak"] }
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "macros", "net", "io-std", "fs"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls-native-certs = "0.8"

[profile.release]
lto = "thin"
